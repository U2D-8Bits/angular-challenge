<div class="w-full max-w-sm mx-auto">
  <div class="text-center mb-8">
    <div class="text-4xl font-bold text-[#1877f2] mb-2 font-sans">PromosApp</div>
    <p class="text-[#606770] text-base leading-snug">Bienvenido, inicia sesión para continuar</p>
  </div>
  <div class="bg-white rounded-lg shadow-md p-4 sm:p-6">
    <form class="flex flex-col gap-4">
      <div class="relative">
        <input type="text" placeholder="Email" class="w-full h-11 px-3 border border-[#dddfe2] rounded-md text-base bg-[#f5f6f7] focus:outline-none focus:border-[#1877f2] focus:bg-white transition-colors" />
      </div>
      <div class="relative">
        <input type="password" placeholder="Contraseña" class="w-full h-11 px-3 border border-[#dddfe2] rounded-md text-base bg-[#f5f6f7] focus:outline-none focus:border-[#1877f2] focus:bg-white transition-colors" />
        <!-- Botón para mostrar/ocultar contraseña -->
        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-base text-[#65676b]">👁️</button>
      </div>
      <!-- Mensaje de error -->
      <!-- <div class="text-[#e74c3c] text-sm mt-1">Error message</div> -->
      <button type="submit" class="w-full h-11 bg-[#1877f2] text-white rounded-md text-base font-semibold transition-colors hover:bg-[#166fe5] disabled:opacity-60 disabled:cursor-not-allowed">Iniciar sesión</button>
    </form>
  </div>
  <div class="text-center mt-6 text-xs text-[#65676b]">
    © 2025 PromosApp. Todos los derechos reservados.
  </div>
</div>
