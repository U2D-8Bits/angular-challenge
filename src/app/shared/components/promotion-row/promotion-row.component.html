<tr [formGroup]="group" class="w-screen">
  <!-- Select de producto -->
  <td class="px-2 sm:px-4 py-2 align-middle">
    <select formControlName="productId"
      class="w-full h-11 px-3 border border-[#dddfe2] rounded-md text-base bg-[#f5f6f7] focus:outline-none focus:border-[#1877f2] focus:bg-white transition-colors">
      <option *ngFor="let option of productOptions" [ngValue]="option.value">{{ option.label }}</option>
    </select>
  </td>
  <!-- Input cantidad -->
  <td class="px-2 sm:px-4 py-2 align-middle">
    <input formControlName="quantity" type="number" placeholder="Cantidad"
      class="w-16 sm:w-20 text-center mx-auto h-11 px-3 border border-[#dddfe2] rounded-md text-base bg-[#f5f6f7] focus:outline-none focus:border-[#1877f2] focus:bg-white transition-colors" />
    <div class="text-xs text-red-600 mt-1" *ngIf="group.get('quantity')?.invalid && group.get('quantity')?.touched">
      <small *ngIf="group.get('quantity')?.errors?.['required']">Cantidad requerida</small>
      <small *ngIf="group.get('quantity')?.errors?.['min']">Mín: {{ group.get('minPromotionQuantity')?.value }}</small>
      <small *ngIf="group.get('quantity')?.errors?.['max']">Máx: {{ group.get('maxPromotionQuantity')?.value }}</small>
    </div>
  </td>
  <!-- Input precio lista (solo lectura) -->
  <td class="px-2 sm:px-4 py-2 align-middle">
    <input formControlName="listPrice" type="number" placeholder="$0,00" readonly
      class="w-20 sm:w-24 text-center bg-gray-100 mx-auto h-11 px-3 border border-[#dddfe2] rounded-md text-base" />
  </td>
  <!-- Input precio promoción con diseño destacado -->
  <td class="px-2 sm:px-4 py-2 align-middle">
    <div class="w-24 sm:w-28 mx-auto rounded-md overflow-hidden border-2 border-yellow-400 flex flex-col">
      <input formControlName="promotionPrice" type="number" placeholder="$0,00"
        class="w-full text-center rounded-t-none border-none bg-white h-11 px-3 text-base" style="border-radius: 0;" />
      <span class="block w-full bg-yellow-400 text-xs text-white font-semibold text-center py-1">
        Precio Promoción
      </span>
    </div>
    <div class="text-xs text-red-600 mt-1" *ngIf="group.get('promotionPrice')?.invalid && group.get('promotionPrice')?.touched">
      <small *ngIf="group.get('promotionPrice')?.errors?.['required']">Precio requerido</small>
      <small *ngIf="group.get('promotionPrice')?.errors?.['min']">Mín: {{ group.get('minPromotionPrice')?.value }}</small>
      <small *ngIf="group.get('promotionPrice')?.errors?.['max']">Máx: {{ group.get('listPrice')?.value - 0.01 }}</small>
    </div>
  </td>
  <!-- Botón eliminar -->
  <td class="align-middle">
    <div class="flex items-center justify-center gap-2">
      <button type="button" (click)="remove.emit()" [disabled]="disableRemove"
        class="w-8 h-8 flex items-center justify-center rounded-full bg-red-500 hover:bg-red-700 text-white transition-colors">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
  </td>
</tr>
