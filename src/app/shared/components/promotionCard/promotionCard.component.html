<form [formGroup]="form">
  <div class="bg-white rounded-lg shadow-md p-4 sm:p-6">
    <!-- Header del componente -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
      <h2 class="text-xl sm:text-2xl md:text-3xl font-semibold text-gray-700">
        Tabla de promociones de productos
      </h2>
      <app-button *ngIf="!isManager" class="w-full sm:w-56" color="#ffb900" hoverColor="#fe9a00"
        (click)="addPromotion()" type="button">
        <span class="material-symbols-outlined align-middle mr-1">
          add_circle
        </span>
        Añadir Productos
      </app-button>
    </div>

    <hr class="my-4 border-gray-200" />

    <!-- Contenedor de la Tabla -->
    <div class="overflow-x-auto mt-6" formArrayName="promotions">
      <table class="min-w-full bg-white border border-gray-200 rounded-lg text-xs sm:text-sm md:text-base">
        <thead>
          <tr class="bg-gray-100 text-gray-700">
            <th class="px-2 sm:px-4 py-2 sm:py-3 text-left font-semibold whitespace-nowrap">Nombre del producto</th>
            <th class="px-2 sm:px-4 py-2 sm:py-3 text-center font-semibold whitespace-nowrap">Cantidad en unidades</th>
            <th class="px-2 sm:px-4 py-2 sm:py-3 text-center font-semibold whitespace-nowrap">Precio lista</th>
            <th class="px-2 sm:px-4 py-2 sm:py-3 text-center font-semibold whitespace-nowrap">Precio promoción</th>
            <th class="px-2 sm:px-4 py-2 sm:py-3 text-center font-semibold whitespace-nowrap">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="promotions.length === 0">
            <td colspan="5" class="text-center py-6 text-gray-400">
              No hay promociones agregadas. Usa el botón "Añadir Productos" para comenzar.
            </td>
          </tr>
          <ng-container formArrayName="promotions">
            <tr *ngFor="let group of promotionGroups; let i = index">
              <td colspan="5" class="p-0">
                <app-promotion-row [group]="group" [products]="products" [productOptions]="getProductOptions(i)"
                  [disableRemove]="promotions.length === 1" (remove)="removePromotion(i)">
                </app-promotion-row>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>

    <hr class="my-4 border-gray-200" />

    <!-- Botón de Enviar Lista-->
    <div class="w-full flex flex-col sm:flex-row items-center justify-end gap-2 mt-4">
      <app-button (click)="submitPromotions()" class="w-full sm:w-56" color="#00c951" hoverColor="#00a63e"
        [disabled]="form.invalid || promotions.length === 0">
        <span class="material-symbols-outlined align-middle mr-1">
          edit_note
        </span>
        Enviar Lista De Promos
      </app-button>
    </div>
  </div>
</form>
